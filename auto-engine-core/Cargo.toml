[package]
version = "0.3.0"
name = "auto-engine-core"
edition = "2024"

[dependencies]
auto-engine-macro = { path = "../auto-engine-macro" }
serde_json = "1.0"
serde_yaml = "0.9.34"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
opencv = { version = "0", default-features = false, features = ["clang-runtime", "imgproc", "imgcodecs"] }
tauri = { version = "2.9.4", features = [] }
regex = "1.11.2"
futures = "0.3"
once_cell = "1.21.3"
base64 = "0.22.1"
evalexpr = "12.0.2"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7.16"
screenshots = "0.8.10"
enigo = { version = "0.6.1", features = ["tokio"] }
schemars = "1.1.0"
async-trait = "0.1.89"
wasmtime = "39.0.1"
wasmtime-wasi = "39.0.1"
anyhow = "1.0.100"
convert_case = "0.10.0"
oar-ocr = "0.3.1"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.12.0", features = ["transport-streamable-http-server-session", "transport-streamable-http-server"] }
http = "1.4.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8.8"
toml = "0.9.10"
async-openai = { version = "0.32.2", features = ["responses", "completions", "chat-completion"] }
secrecy = "0.10"
bytes = "1.11.0"
uuid = { version = "1.11.0", features = ["v4"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.1"

[features]
default = ["types", "context", "event", "pipeline", "runner", "utils"]
types = []
context = []
event = []
pipeline = []
runner = []
utils = []
tauri = []
wasm = ["types"]
